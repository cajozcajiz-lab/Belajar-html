<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 200px;
            flex-wrap: wrap;
        }
        .card{
            width: 150px;
            height: 150px;
            padding: 18px;
            margin: 10px;
            border: 2px solid black;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <div class="container">

    
    <div class="card">
        <h1>TikTok</h1>
        <p>sosial media paling populer</p>
    </div>

    <div class="card">
        <h1>Instagram</h1>
        <p>sosial media untuk berbagi foto</p>
    </div>

    <div class="card">
        <h1>WhatsApp</h1>
        <p>sosial media untuk berkomunikasi</p>
    </div>

    <div class="card">
        <h1>Twitter</h1>
        <p>sosial media untuk berbagi pendapat</p>
    </div>

    </div>
</body>
</html>
